[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoforge"
version = "0.1.0"
description = "Adaptive crypto trading and strategy research platform for Bybit."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
typesafe = [
  "typesafe-sdk>=0.5.0",
]

[project.scripts]
cryptoforge-backup = "cryptoforge.backup:main"
cryptoforge-doc-eval = "cryptoforge.document_eval_cli:main"
cryptoforge-migration = "cryptoforge.migration:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: tests that call live external services",
]
